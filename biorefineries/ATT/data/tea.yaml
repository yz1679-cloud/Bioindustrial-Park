# Model Assumptions: Techno-Economic Analysis (TEA) of the ATT system (research stage)
#
# Read by analyses/tea.py (and the inventory, LCA and reporting modules). Top-level sections:
#   operating_days, financial   plant uptime and the ATTTEA financial assumptions (FCI = installed equipment cost)
#   prices                      Sargassum, disposal, reagent and product prices
#   caco3_sales                 CaCO3 byproduct sales assumptions;  cost_year: equipment cost basis
#   sensitivities, limitations  sensitivity ranges and the documented TEA limitations

# Plant uptime, in operating days per year.
operating_days: 330

# Economic and financing assumptions of ATTTEA (the DCF behind the MSP).
financial:
  IRR: 0.10
  duration: [2026, 2046]
  depreciation: "MACRS7"
  income_tax: 0.21
  construction_schedule: [0.4, 0.6]
  WC_over_FCI: 0.05
  finance_interest: 0.08
  finance_years: 10
  finance_fraction: 0.6
  startup_months: 3
  startup_FOCfrac: 1.0
  startup_VOCfrac: 0.5
  startup_salesfrac: 0.5
  foc_frac_of_fci: 0.04

basis: "ATTTEA with tea.yaml financial assumptions; ATT model with the active U2 closure (att.yaml) at the SaBRe reference scale"
cost_year_note: "ASSUMPTION: all equipment is costed in 2020 USD (CEPCI 596.2, the basis of the NLR Sargassum TEA used for the feed and press data); see cost_year below. Material and utility prices are of mixed years, recorded below, and are not escalated."
product: h2_product   # MSP solved on this stream

prices:   # USD per kg of stream unless noted (per wet kg for the Sargassum feedstock and the disposal entries)
  # Feedstock
  sargassum:
    value: 0.0
    range: [-0.02, 0.1]
    distribution: "uniform"
    source: "Rodriguez-Martinez et al. 2023 (Sci Total Environ); cleanup costs $19-85/m3 wet = $0.024-0.106/kg wet"
  
  # Waste streams, negative price to indicate as a cost
  disposal_solid:
    value: -0.04
    range: [-0.08, 0]
    distribution: "uniform"
    source: "ASSUMPTION carried over from the SaBRe tea.yaml (standard biosolids 30-80 USD/dry t); 0.04 USD/kg = 40 USD/t wet. Cross-check (2026-11-04): the U.S. average MSW landfill tipping fee was 56.80 USD/t unweighted and 57.63 USD/t ton-weighted in 2023 (EREF, Analysis of MSW Landfill Tipping Fees 2023, https://erefdn.org/analyzing-municipal-solid-waste-landfill-tipping-fees/; Southeast 43.18, Northeast 84.44 USD/t). The value is below the national average and inside the range."

  disposal_wastewater:
    value: -0.004
    range: [-0.008, 0]
    distribution: "uniform"
    source: "ASSUMPTION carried over from the SaBRe tea.yaml (WWT 3-8 USD/m3); 0.004 USD/kg = 4 USD/m3. No adequate source was found (2026-11-04 search): no U.S. municipal industrial-discharge rate is published, and the treatment-cost figures found are non-U.S. and technology-specific (about 0.3 to 4 USD/m3). Not independently verified. The excess condensate is nearly pure water and is charged at this rate too."

  NaOH:
    value: 0.35
    range: [0.35, 0.526]
    source: "SaBRe tea.yaml baseline (no literature source). High: 0.2384 USD/lb in biorefineries/lactic/_process_settings.py. Cross-check (2026-11-04): U.S. Gulf spot export FOB 405 USD/t in Q3 2025 and 475 USD/t in Q2 2025 (JBI caustic soda table, https://jbi.org.jm/caustic-soda/); an index value of 379 USD/t for the U.S. (IMARC, https://www.imarcgroup.com/news/caustic-soda-price-index). The product form (solution or solid flakes, which cost more) is not stated, so 0.35 USD/kg is at or below the quoted 0.38-0.41 USD/kg and remains an assumption."
  CaOH2:                 # fresh (purchased) lime; ATT S1 uses free waste lime (price 0, scenarios.tea_config)
    value: 0.280
    year: 2025
    source: "USGS MCS 2026, hydrated lime 2025 estimate 280 USD/t, average value at plant (f.o.b.), transport NOT included."
  H2SO4:
    value: 0.0948
    source: "0.0430 USD/lb, biorefineries/lactic/_process_settings.py (purge neutralization, lca.yaml endpoint)"
  HCl_31:                # 31 wt % HCl solution, per kg of solution (REE leach; used only with ree_recovery)
    value: 0.20
    source: "2026 quotes: US 215, global 185-205 USD/t (Expert Market Research, ChemAnalyst); assumption. Cross-check (2026-11-04): U.S. import price 265 USD/t in September 2025 (Intratec, https://www.intratec.us/chemical-markets/hydrochloric-acid-price) and North America 243 USD/t in October 2025 (ChemAnalyst); grade and delivery basis are not stated and the sources are market-news pages, so 0.20 USD/kg is at the low end."
  oxalic_acid:           # per kg of oxalic acid (REE precipitation; used only with ree_recovery)
    value: 0.60
    source: "China 2026: 435-710 USD/t (ChemAnalyst, ChemicalBook); assumption. Cross-check (2026-11-04): 2025 prices of 603-684 USD/t for the U.S., 443-503 for China and 543-614 for India (Expert Market Research, https://www.expertmarketresearch.com/price-forecast/oxalic-acid-price-trends); 0.60 USD/kg is inside the U.S. range."
  REO:                   # sale price of the REE product per kg of REO it contains (ree_recovery only)
    value: 35.0
    range: [2.0, 151.0]
    source: "ASSUMPTION: 35 USD/kg REO (mixed concentrate, >= 92 % TREO, Apr 2026); 2 = light mixed carbonate, 65 = heavy-REE clay basket, 97 = NdPr oxide, 151 = equal-mass 14-REE oxides. A 1.3 wt % TREO solid would not fetch these without a buyer."
  att_char:              # selling price of the ATT residue (stream att_char: the insoluble part of the ATT residue, the leached char cake, 30 wt % moisture) per kg of WET cake
    value: 0.0
    source: "ASSUMPTION (user decision 2026-11-04): the char, after some processing (drying, activation, etc.), is used as a sorbent like biochar, so buyers take it for free (net price 0). No buyer or specification. Positive = revenue; without a buyer the cake would be disposed at disposal_solid (-0.04 USD/kg wet, about +0.094 USD/kg H2 on the S1 MSP). The LCA is unchanged (landfill factor 0; the carbon of the residue stays credited)."
  process_water:
    value: 0.000441
    source: "0.0002 USD/lb (Humbird et al. 2011), biorefineries/lactic and HP process settings"
  wastewater_streams: [excess_condensate, u3_dryer_removed_water, liquor_purge, f2_wash_liquor]
  solid_waste_streams: [att_char, scrubber_cake, salt_cake]
  # Streams priced at disposal_wastewater / disposal_solid above (negative = cost).
  offgas: 0.0              # no sale price; its fuel value is credited as natural gas displaced in the U2 burner (voc item)
  natural_gas_note: "BioSTEAM default natural_gas agent price (USD/kmol CH4) converted to USD/MJ LHV and applied to fuel = U2 duty / burner efficiency 0.90 (same basis as the LCA)."
  steam_note: "LP steam at the BioSTEAM default agent price, which covers generation; boiler natural gas is not priced separately (no double counting)."
  cooling_note: "Cooling water at the BioSTEAM default price, which covers tower operation; cooling-tower electricity is not priced separately."
  electricity_note: "BioSTEAM default PowerUtility price on the modeled unit power; estimated agitator and EC1 vacuum power added."

# Equipment capital is costed inside the unit models (U2 vessel and furnace, C1 tank, EC1 evaporator,
# condenser and vacuum system, the PSA in U3P, the reciprocating compressor U3K; see att.yaml).
# The TEA only adds the PSA cost-factor adjustment.

# ATT Scenario 1 CaCO3 BYPRODUCT SALES: ON in the baseline (user decision 2026-11-02: both CaCO3 cakes are sold at the
# price below, the non-CaCO3 mass is disposed; TEA marketing ASSUMPTION, no sales agreement). With enabled: false the
# cakes are disposed at the tea.yaml solid-waste price and earn no revenue.
# Applied by analyses/breakdown.py (the ATT S1 TEA) to each listed cake stream that is a system product:
#   revenue  = saleable_fraction x CaCO3 component mass x price (the CaCO3 content only, not the wet cake);
#   disposal = tea.yaml disposal_solid x (cake mass - sold CaCO3 mass): the moisture, excess Ca(OH)2 and entrained
#              NaOH/Na2CO3 stay a disposed residue (dispose_non_caco3_mass); the sold CaCO3 is not disposed
#              (disposal_of_sold_caco3: false). Net = one stream price, so revenue and disposal enter the DCF once.
# Simplification: the cake is sold as recovered (no drying, classification, packaging or transport is modeled or
# costed; F2 washing W2/F2R is modeled); industrial grade only. Modeled purity (F2 82.5 %, F3 93.1 % dry basis) is
# below the experimental ~97 %, whose measurement basis is not confirmed (see notes).
# ACCOUNTING APPROXIMATION (finalization 2026-11-01): no unit separates the CaCO3 from the cake. Physically the
# whole wet cake leaves; the split above is a NET CAKE PRICE = CaCO3 content x price - disposal_solid x the
# non-CaCO3 mass, i.e. a buyer discount for moisture, Ca(OH)2 and sodium. It is not double counted (one stream
# price) but it is an UPPER-BOUND case: no buyer or specification exists for this cake. The LCA credits the Sargassum
# carbon of the sold CaCO3 like landfilled carbon (lca.yaml carbon_storage).
caco3_sales:
  enabled: true
  streams: [caco3_cake, scrubber_cake]   # F2 causticizing cake and F3 CO2-scrubber cake (distinct CaCO3 flows)
  saleable_fraction: 1.0
  price_usd_per_metric_ton: 100.0        # OPTIMISTIC unverified reference, no confirmed product specification or buyer
  disposal_of_sold_caco3: false
  dispose_non_caco3_mass: true
  price_note: "100 USD/t baseline assumption; 315 USD/t approximate public US industrial-market reference (not verified for this product); 0 = no-revenue outlet with the same routing (sold CaCO3 taken away at no cost, non-CaCO3 mass still disposed)."

# REE PRODUCT GRADE sensitivity (analyses/ree_sensitivity.py). The collaborators' case of a seaweed soaked in a concentrated REE
# solution gives a 98 wt % REO product (their 0.01 M Nd run: 98.8 % Nd2O3). ONLY THE GRADE changes: the REO mass of the product
# stays at overall_recovery of the REE of the dilute wastewater and the mineral filler shrinks; a larger REE loading of the seaweed
# is NOT modeled. The REO price is swept because a 98 % product may sell above the 35 USD/kg of the mixed concentrate.
ree_grade_sensitivity:
  grades_REO_wt_frac: [0.0131, 0.05, 0.20, 0.50, 0.98]
  prices_usd_per_kg_REO: [65.0, 97.0, 151.0]

# PSA off-gas (mainly CH4 + unrecovered H2, CO, CO2): fate unresolved; no reliable handling cost;
# explicit placeholders per t of off-gas. Reference: 0.
offgas_handling_usd_per_t: [0.0, 10.0, 25.0]
offgas_note: "Placeholder collection/flaring/venting cost; no equipment designed. Off-gas carries the model CH4 (s x reported); final fate unresolved."

# Cost basis: 2020 USD (user decision 2026-10-16, the basis of the NLR Sargassum
# preprint TEA). Equipment is costed at the 2020 CEPCI; prices keep the year
# recorded with each entry (no escalation); the municipal biosolids press anchor
# (2021 report) and the PSA anchor (year unknown) are used as 2020 USD.
cost_year:
  basis_year: 2020
  reference_CE: 596.2
  reference_note: "Annual CEPCI 2020 (Chemical Engineering), set as bst.CE by create_att_system. The other SaBRe pathways use the BioSTEAM default 567.5 (2017)."
  comparison_CE: 800.0
  comparison_note: "Approximate 2024 CEPCI (monthly values ~800 in 2024, Chemical Engineering, https://www.chemengonline.com/cepci). Escalates BioSTEAM correlations and the inventory equipment estimates only; the PSA anchor (year unknown) and all prices are not escalated."

limitations:
  - "FCI = installed equipment cost (SaBRe convention): no separate engineering, construction, contingency or other indirect capital; see FCI sensitivity."
  - "PSA capital is a preliminary review-based estimate (+/-50 %), not a correlation or vendor quote."
  - "Equipment at CEPCI 596.2 (2020 USD) while chemical prices are 2024-2025 and utility prices are BioSTEAM defaults (older basis); the MSP is therefore not a single-year number. Only the municipal press anchor (3.1 MUSD, year unrecorded in the source) and the PSA anchor (year unknown) are not escalated."
  - "FOC = 4 % of FCI lumps labor, maintenance and overhead; labor is not estimated explicitly."
  - "att_residue_untracked (the lumped residual carbon of U2 beyond the carbonate, gas and char, about 1.9 t/h) has no sink in the model: it is not sold, disposed or treated, so no cost is booked for it (stream_prices)."
  - "The disposal prices (solid 40 USD/t, wastewater 4 USD/m3) are assumptions carried over from SaBRe; the solid fee has a tipping-fee cross-check, the wastewater fee has no adequate source (prices.disposal_*.source)."
  - "Not costed: feed receiving/storage and solids handling, chemical storage, off-gas handling (placeholder sensitivity only), CaCO3 product finishing."
  - "No CH4/CO revenue: reported experimental CH4/CO are outside the element-balanced model."
  - "No lime regeneration (kiln) or alternative lime sourcing in the economics."

# PRICE BASIS OF EVERY BOUNDARY STREAM (system.feeds and system.products of ATT S1 and S2) AND OF EACH UTILITY. The price values are
# in prices above, caco3_sales and the unit settings; this register says how each one was decided. A test
# (test_att_stream_register) fails when a boundary stream of the S1 flowsheet has no entry here or in lca.yaml stream_factors.
stream_prices:
  att_sargassum_feed: "prices.sargassum (0). Waste biomass assumed delivered free to the plant gate; collection and transport are not costed. Reference costs: beach cleanup 19-85 USD/m3 wet (Rodriguez-Martinez et al. 2023); a Saint-Martin contract of 22.50 EUR/t for collection and transport to a landfill (news report, Daily Herald, secondary source)."
  dryer_air: "Ambient drying air, price 0."
  scrubber_dryer_air: "Ambient drying air, price 0."
  caco3_dryer_air: "Ambient drying air, price 0."
  roaster_air: "Ambient combustion air of the REE roaster, price 0."
  dryer_backup_fuel: "Backup fuel port of the drum dryer (steam heated): zero flow in the baseline, price 0."
  scrubber_dryer_backup_fuel: "Backup fuel port of the drum dryer: zero flow in the baseline, price 0."
  caco3_dryer_backup_fuel: "Backup fuel port of the drum dryer: zero flow in the baseline, price 0."
  u3_tail_gas: "Port for PSA tail gas burned in U2: zero without a PSA; with a PSA its fuel value is credited as natural gas displaced (voc item), not as a price."
  fresh_naoh_solid: "prices.NaOH (0.35 USD/kg). SaBRe baseline, no literature source; market cross-check in prices.NaOH.source."
  lime: "0 for the waste carbide lime (scenario att_s1 lime: waste, a free by-product of an acetylene plant, user decision); a purchased lime would cost prices.CaOH2 (USGS 2026)."
  scrubber_lime: "0 for the waste carbide lime (as lime)."
  dissolution_water: "prices.process_water (Humbird et al. 2011)."
  f1_wash_water: "prices.process_water (Humbird et al. 2011); zero flow in the baseline because condensate is used."
  f2_wash_water: "prices.process_water (Humbird et al. 2011); zero flow in the baseline because condensate is used."
  scrubber_makeup_water: "prices.process_water (Humbird et al. 2011)."
  leach_water: "prices.process_water (Humbird et al. 2011); zero flow in the baseline because condensate is used."
  leachate_naoh: "prices.NaOH; zero flow in the baseline."
  fresh_hcl: "prices.HCl_31 (0.20 USD/kg of 31 wt % solution); assumption with market-news cross-check in its source."
  fresh_oxalic_acid: "prices.oxalic_acid (0.60 USD/kg); assumption inside the U.S. range of its cross-check."
  h2_product: "The solved minimum selling price (ATTTEA.solve_price) per kg of product gas, restated per kg of H2."
  caco3_cake: "Net price from caco3_sales: CaCO3 content sold at price_usd_per_metric_ton, the rest disposed at prices.disposal_solid (assumption, no buyer)."
  scrubber_cake: "Net price from caco3_sales (as caco3_cake)."
  ree_product: "prices.REO (35 USD/kg REO, assumption) times the REO mass fraction of the product."
  att_char: "prices.att_char (0, assumption: taken as a sorbent for free)."
  liquor_purge: "prices.disposal_wastewater (4 USD/m3, assumption)."
  excess_condensate: "prices.disposal_wastewater (4 USD/m3, assumption); the condensate is nearly pure water."
  u3_dryer_removed_water: "prices.disposal_wastewater (4 USD/m3, assumption)."
  salt_cake: "prices.disposal_solid (40 USD/t wet, assumption with a tipping-fee cross-check)."
  dryer_exhaust: "Air and water vapor to the atmosphere, no fee."
  dryer_emissions: "Dryer emission port to the atmosphere, zero flow in the baseline, no fee."
  scrubber_dryer_exhaust: "Air and water vapor to the atmosphere, no fee."
  scrubber_dryer_emissions: "Dryer emission port to the atmosphere, zero flow in the baseline, no fee."
  caco3_dryer_exhaust: "Air and water vapor to the atmosphere, no fee."
  caco3_dryer_emissions: "Dryer emission port to the atmosphere, zero flow in the baseline, no fee."
  roaster_exhaust: "Roaster exhaust to the atmosphere, no fee and no treatment cost."
  leach_co2: "CO2 of the REE leach to the atmosphere, no fee."
  att_residue_untracked: "OPEN GAP: price 0. The lumped residual carbon of U2 beyond the carbonate, gas and char has no measured sink; it is neither sold nor disposed nor treated, so no cost is booked (see limitations)."

utility_prices:
  natural_gas: "BioSTEAM default agent price, converted to USD/MJ LHV and applied to fuel = U2 duty / burner efficiency 0.90 (natural_gas_note above)."
  low_pressure_steam: "BioSTEAM default agent price (covers generation, so boiler gas is not priced again) (steam_note above)."
  cooling_water: "BioSTEAM default agent price (covers tower operation) (cooling_note above)."
  electricity: "BioSTEAM default PowerUtility price on the modeled unit power (electricity_note above); the default is older than the 2020 cost basis."

sensitivities:
  PSA_capex_factor: [0.5, 1.5]
  CaOH2_price: [0.235, 0.350]
  NaOH_price: [0.35, 0.526]
  natural_gas_price_factor: [0.7, 1.3]
  electricity_price_factor: [0.7, 1.3]
  FCI_factor: [0.7, 1.3]
