    CaOH2_limestone: {value: 0.91, unit: "kg CO2e/kg", range: "0.59-1.00", cell: B26}
    CaOH2_steel_slag: {value: 0, unit: "kg CO2e/kg", range: "0-0.10, assumed", cell: B27}
    natural_gas_heat: {value: 0.056, unit: "kg CO2/MJ", note: "IPCC 2006; burner eff. 0.90", cell: B28}
    marine_fuel: {value: 3.2, unit: "kg CO2/kg", note: "LHV 41 MJ/kg", cell: B29}
    engine_waste_heat: {value: 0, unit: "kg CO2/MJ", note: "assumed", cell: B30}
  boundary:
    included: {value: "ATT reactor, CO2 capture on Ca(OH)2, NaOH regeneration loop, process heat, NaOH and Ca(OH)2 make-up.", cell: A33}
    not_included: {value: "harvesting and transport, pumping and mixing power, H2 compression, capital goods, REE refining, CaCO3 product credit.", cell: A34}
  results_reported: "None. The workbook contains LCA inputs (functional unit, emission factors, boundary) but no GWP results."
