# Alkaline Thermal Treatment (ATT) assumptions
# Baseline process case: Ni-CatATT.
# Raw Sargassum composition/moisture/ash are called from SaBRe feedstock.yaml.
#
# U2 basis (2026-10-09): full C/H/O/N/S/Na/Ca closure with redox-reconciled
# gas yields. See reactor.material_balance for the derivation.
#
att:
  # ---------------------------------------------------------------------
  # DATA SOURCES (where the numbers in this file come from)
  # ---------------------------------------------------------------------
  data_sources:
    workbook:
      file_name: "ATT Inputs and Assumptions_261005.xlsx"
      sha256: "879812409893953d1692507437197ba8f62c0e218bdf37fe979df051e19b9c9c"
      provider: "UCLA ATT collaborators (unpublished; redistribution needs their permission)"
      sheets: ["Experimental results", "Assumptions for energy analysis"]
      note: "The workbook is not distributed. Values taken from it are given below with their sheet!cell reference. Workbook values that the model does not use (yields of the ATT, CatATT and Ni-ATT cases, 3.6 g steam per run, workbook ash 17.2 wt % and moisture 85 wt %) are intentionally not copied. Presentation slides are NOT a source."
    sections:
      reactor.cases.Ni-CatATT: "Workbook, sheet 'Experimental results', row 8 (gas yields H2/CH4/CO/CO2 and ignored Gas 4); loading 1 g NaOH per 0.5 g daf is advisor-confirmed."
      reactor.target_temperature_K: "Workbook 'Experimental results' footnote (500 C) and energy-analysis sheet B13."
      reactor.material_balance (naoh_to_na2co3_conversion): "Workbook, energy-analysis sheet B15 (100 %)."
      reactor.material_balance (gas closure): "Model decisions by the user, 2026-10-09 to 2026-10-12 (explained in the comments there); the measured yields are never modified."
      reactor.heat_loss_fraction, downstream.heat_loss_fraction: "Workbook, energy-analysis sheet B20 (5 %; cited there as Gracia-Monforte et al. 2026)."
      reactor.energy_basis.feed_HHV, feed_energy_reference: "Workbook, energy-analysis sheet B7 (16.9 MJ/kg daf; literature range 15.7-19.5, D7). Not a measured HHV of the SaBRe feed."
      reactor.energy_basis.sensitivity_feed_HHV_MJ_per_kg_daf.primary_composition_consistent: "Thornton / Channiwala-Parikh correlations on the model daf composition."
      feed_preparation: "Moisture target 50 wt % from workbook B12 (assumed); press to 75 wt % plus thermal dryer D0 is the user-confirmed process design of 2026-10-09. Feedstock composition, ash and moisture come from feedstock.yaml (SaBRe database), not from the workbook."
      feed_preparation.dryer.equipment_specific_energy_MJ_per_kg_water: "Danish Energy Agency (1998), tabulated by DryingMate A/S (Teknologisk Institut)."
      gas_treatment: "Provisional engineering assumptions (condenser, dryer, PSA, compressor); not collaborator-confirmed."
      downstream.dissolution_water_kg_per_kg_Na2CO3, causticization_conversion, lime_equiv: "Workbook, energy-analysis sheet B18, B17, B16 ('commercial causticizing')."
      downstream.recycle_naoh_wt_frac: "Workbook B19 ('water left in recovered NaOH', 50 wt %), applied as NaOH/(NaOH + H2O) by user decision 2026-10-09."
      downstream.whole_liquor_recycle_fraction: "Source reports '95 % NaOH recycling' without defining a separator; interpreted as 95 % whole-liquor recycle (provisional engineering baseline)."
      downstream.filter cake moistures: "F1 30 wt %: literature-supported engineering baseline. F2 25 wt %: CaCO3/lime-filtration literature review."
      downstream (EC1 and U2 NaOH data): "ec1_boiling_point_elevation_K from the Olsson et al. 1997 vapor pressure of NaOH(aq); ec1_na2co3_dissolved_fraction from Wu et al. 2020 Na2CO3 solubility near 50 wt% NaOH; naoh_heat_of_solution_kJ_per_kg from NBS (-44.5 kJ/mol), Olsson et al. 1997 and the OxyChem Caustic Soda Handbook Table 11."
      energy_sources: "Workbook, energy-analysis sheet B28-B30 (natural gas IPCC 2006 with burner efficiency 0.90, marine fuel, engine waste heat)."
      heat_recovery: "BioSTEAM defaults and engineering assumptions; cooler heat-transfer coefficients and the HXN approach temperature are unverified."
      inventory.lca.emission_factors: "NaOH, Ca(OH)2 and natural-gas factors from the collaborators' workbook (energy-analysis sheet B25-B28); electricity from GREET 2022 US mix (biorefineries/HP/process_settings.py); boiler efficiency from the BioSTEAM default."
      inventory.cost_estimates: "Engineering estimates (TEA input only)."
      inventory.reference_scale: "SaBRe common plant scale (feedstock.yaml, tea.yaml)."
  # Definition differences between the source workbook
  # (ATT Inputs and Assumptions_261005.xlsx) and this model, recorded so
  # they are not silently re-interpreted. "model_value" is what is used.
  basis_discrepancies:
    ash_and_moisture:
      workbook: "Ash 17.2 wt% dry; moisture as harvested 85 wt% (energy-analysis sheet)"
      model_value: "feedstock.yaml pelagic: ash 34.53 wt% dry, moisture 86.73 wt%"
      decision: "User decision 2026-10-09: use the SaBRe database values."
      impact: "daf per kg dry is 0.655 (database) instead of 0.828 (workbook), so gas, NaOH and Na2CO3 flows per kg dry are ~21% lower than with the workbook ash."
    feed_dewatering:
      workbook: "Sargassum moisture content 50 % 'assumed (mechanical dewatering)'; collaborator flowsheet (2026-09-28) has no biomass dryer"
      model_value: "P1 screw press to 75 wt% moisture, then D0 thermal drying to 50 wt% (wet basis)"
      decision: "User-confirmed original process design 2026-10-09: D0 is required; mechanical dewatering alone is not assumed to reach 50 wt%."
    naoh_loading:
      workbook: "Experimental sheet: 0.5 g seaweed + 1 g NaOH (seaweed mass basis not stated); energy-analysis sheet: NaOH:seaweed (daf) = 1 g/g"
      model_value: "1 kg NaOH / kg daf (scenario 4: 2.995, full CO2 capture)"
      decision: "Advisor-confirmed basis (1 g NaOH per 0.5 g daf) is the baseline (scenario 1); the full-capture dose is an alternative scenario (user decision 2026-10-17)."
    ec1_concentration_target:
      workbook: "'Water left in recovered NaOH' = 50 wt% (a water fraction)"
      model_value: "NaOH = 50 wt% of the total recycle liquor (NaOH + Na2CO3 + water); water is then ~41 wt%"
      decision: "User decision 2026-10-09: not binding. Model evaporates only the excess water so that NaOH/(NaOH + H2O) = 50 wt% after the fresh solid-NaOH makeup (Na2CO3 is mostly crystalline and excluded)."

  feed_preparation:
    # Feed composition (data/feedstock.yaml, NLR Sargassum preprint): the
    # The fresh_sargassum configuration starts from fresh Sargassum (nlr_fresh) and has P1; the presscake
    # configuration receives the presscake of a biostimulant plant (nlr_pressed) and has no P1.
    # Plant scale of the NLR preprint TEA (3 million wet t/yr; 1,306 dry t/d in
    # the preprint; 3e6 / 330 d = 9,091 wet t/d here), replacing the SaBRe
    # common 15,000 wet t/d for the ATT cases.
    scale:
      wet_feed_tonnes_per_year: 3000000
    feedstock_type: nlr_fresh
    presscake_feedstock_type: nlr_pressed
    # P1 mechanical dewatering to the 15 psi screw-press result of the
    # preprint (23.7 % solids), then D0 thermal drying to 50 wt% moisture
    # before U2. D0 is required: the press reaches only 73-76 % moisture, not
    # 50 % (preprint Table 2); the preprint's own TEA assumes 20 % solids.
    press_cake_moisture_wt_frac: 0.763
    press:
      # Share of the dry solids that stay in the cake (preprint Table 2, 15 psi:
      # 17.86 kg x 23.7 % / (30.36 kg x 14.3 %)). Component retention in the
      # cake follows from the fresh and pressed compositions (capped at 1);
      # the rest (ash/salts, mannitol, part of the protein) leaves in the
      # press liquid.
      solids_recovery: 0.975
      # Municipal biosolids screw press (City of Bellingham TM-12, 2021; same
      # anchor as preprocessing.yaml): installed cost scaled on the dry-solids
      # throughput, single train, exponent 0.6. Treated as 2020 USD (not
      # escalated). Replaces BioSTEAM's ScrewPress correlation (115 parallel
      # units at the SaBRe scale).
      capex_installed_ref_usd: 3100000.0
      ref_capacity_tph_dry: 0.953
      scale_exponent: 0.6
      # Press-only electricity (HUBER screw press case study, 2023), per dry
      # tonne of solids. BioSTEAM's ScrewPress applies 37.2 kWh per tonne of
      # WET feed instead (about 56x higher at this feed).
      power_kWh_per_dry_ton: 5.0
      # The press liquid is the raw juice for biostimulant production and is
      # a coproduct of the fresh-Sargassum plant (no wastewater charge; transfer
      # price in att_tea.yaml).
    att_sargassum_moisture_wt_frac: 0.5
    dryer_temperature_K: 343.15
    dryer:
      baseline_model: bst.DrumDryer
      baseline_status: "Modeling choice (ATT_PROCESS.xlsx); retained as the baseline."
      # The D0 heat utility is an ASSUMED THERMAL DUTY: an ideal heat balance
      # (drying air leaving at dryer_temperature_K and 80 % RH, no losses),
      # ~3.0 MJ/kg water evaporated. It is not the heat input of real dryer
      # equipment, which is reported separately from the typical specific
      # heat use below and is not used in the baseline utilities.
      thermal_duty_basis: ideal_heat_balance
      # Drying air (an ambient-air carrier; the steam heats the drum) is sized
      # so that the exhaust leaves at this relative humidity at the dryer
      # temperature (a saturated or over-saturated exhaust would condense).
      exhaust_relative_humidity: 0.8
      # BioSTEAM sizes one drum from a specific evaporation rate (20 kg/h/m3).
      # At this scale that is one 6.5 m x 164 m drum, so the drying load is split
      # over identical parallel drums of at most this diameter and the
      # length-to-diameter ratio below (rotary-dryer practice is L/D 4-10).
      max_drum_diameter_m: 4.5
      drum_length_to_diameter: 5.0
      # Typical specific heat use of dryer equipment [MJ/kg water evaporated]:
      # Danish Energy Agency (1998), tabulated by DryingMate A/S
      # (Teknologisk Institut). Heat-pump values are electricity.
      equipment_specific_energy_MJ_per_kg_water:
        drum_contact: [3.2, 6.5]
        belt_conveyor: [4.0, 6.0]
        superheated_steam: [2.5, 2.5]
        heat_pump_electric: [0.5, 1.1]
    fresh_naoh_form: solid
    fresh_naoh_wt_frac: 1.0
    fresh_naoh_temperature_K: 298.15
    # Fresh solid NaOH is added in M1 and dissolves in the water of the wet
    # feed (there is no separate makeup mixer).
  reactor:
    target_temperature_K: 773.15
    heat_loss_fraction: 0.05
    legacy_heat_duty_kJ_per_kg_dry_sargassum: 10423.77
    baseline_case: Ni-CatATT
    cases:
      Ni-CatATT:
        # NaOH loading and gas yields of the experimental team's energy and
        # exergy calculation (Gyudae Sim, UCLA, 2026-09-28; Excel read from the
        # slides): 1 g NaOH per g daf and the gas slate below. The slate closes
        # carbon, hydrogen, sodium and the electron balance of the feed (gas
        # electrons 149.9 mmol/g daf against a feed capacity of 148-150), unlike
        # the absolute yields measured in the laboratory run (204 mmol e-/g daf).
        # BASELINE (scenario 1, 2026-10-17): the team's 1 g/g. Scenario 4 (analyses/att/scenarios.py) overrides it with the
        # dose that captures all the CO2 generated: 2 NaOH per CO2, CO2 generated at 1 g/g = 22.68 (gas) + 2.26 (carbon
        # closure) + 12.50 (carbonate) = 37.44 mmol/g daf, so 74.88 mmol NaOH/g daf = 2.995 g/g and the gas CO2 is 0.
        naoh_kg_per_kg_daf: 1.0
        naoh_loading_basis: 'Experimental team energy calculation: NaOH : biomass (daf) = 1 g/g (the lab run used 1 g NaOH per 0.5 g seaweed).'
        gas_yield_mmol_per_g_daf:
          H2: 70.52
          CH4: 0.70
          CO: 0.31
          CO2: 22.68
        gas_yield_basis: Experimental team energy and exergy calculation (Excel), U2 outlet gas per kg total solids converted to mmol per g daf with their 71.7 wt % volatile solids.
        ignored_reported_gas_yields_mmol_per_g_daf: {}
        excluded_baseline_gas_species:
        - C2H4          # 0.10 mmol/g daf each in the team slate; ~1 % of the carbon, not modeled
        - C2H6
        - N2
        - H2S
    material_balance:
      # Workbook assumption (energy-analysis sheet), retained: all NaOH is
      # converted to Na2CO3 at the 1 g/g loading.
      naoh_to_na2co3_conversion: 1.0
      # The gas yields above are specified. U2 closes the C and H balances with
      # the gases, Na2CO3 and two sinks for what is not identified: product
      # water (H) and a small unreacted residue 'Char' (C), which only gives the
      # leftover carbon a place to go (0.012 kg/kg dry feed for the team's slate).
      # N and S stay with the residue (CharN/CharS). The oxygen balance is a
      # CHECK, not an unknown (the team's slate closes it within 0.1 %); the
      # electron balance and the NaOH capacity for CO2 are reported by
      # ATTReactor.balance_checks().
      gas_closure_method: specified_yields
      char_species: Char
      heteroatom_species:
        N: CharN
        S: CharS
      enforce_full_elemental_balance: true
    energy_basis:
      # Duty = Hnet(outlets) - Hnet(inlet), i.e. includes reaction enthalpy.
      # The feed organics' formation enthalpy is re-referenced to the HHV
      # below (Hess's law) instead of the per-pseudo-component Hf, which imply
      # 17.76 MJ/kg daf with borrowed Glucan Hf values.
      feed_HHV_MJ_per_kg_daf: 16.9
      # U2 energy sensitivity (analyses/att/thermodynamics.py), user decision
      # 2026-10-09. CONDITIONAL ENGINEERING SENSITIVITY RANGE under the
      # active gas closure; not a statistical confidence interval. U2 inlet
      # fixed; excludes the gas closure itself, NaOH conversion, heat-loss
      # fraction and recycle effects. External heating per kg dry feed,
      # primary HHV range: h2_priority baseline 8.94-10.42 MJ (central 9.87);
      # uniform_redox_scaling comparison (s = 0.5998) 8.08-9.65 MJ (9.06).
      sensitivity_feed_HHV_MJ_per_kg_daf:
        primary_composition_consistent: [16.3, 18.1]   # Thornton / Channiwala-Parikh on the model daf composition
        secondary_literature: [15.7, 19.5]
      # The dissolved NaOH in the recycle liquor is corrected for the heat of
      # solution (downstream.naoh_heat_of_solution_kJ_per_kg; ThermoSTEAM
      # treats it as subcooled molten NaOH).
      not_included: "Dissolution enthalpy of the small amount of dissolved Na2CO3 in the recycle liquor."
    sensitivity_plan:
      naoh_loading: Planned sensitivity parameter; baseline is 2 kg NaOH/kg daf.
      individual_gas_yields: Planned sensitivity parameters around the reported Ni-CatATT yields.
  gas_treatment:
    # STEP 7.5 U3 baseline.
    #
    # U3 is implemented primarily with native BioSTEAM units:
    #   U3C Flash -> U3D Splitter -> U3K IsothermalCompressor -> U3P Splitter -> U3V valve (tail gas)
    #
    # The numerical values below are explicit PROVISIONAL engineering
    # assumptions so the complete flowsheet can run. Replace them when
    # UCLA/collaborator gas-treatment specifications are available.
    condenser_temperature_K: 313.15
    condenser_pressure_Pa: 101325.0
    condenser_status: "Provisional 40 C, 1 atm condensation baseline; not collaborator-confirmed."

    # U3D native molecular-sieve dehydration baseline. The Water split is
    # still a reduced-order process specification because collaborator dew-point
    # / dryer-cycle data are not yet available. BioSTEAM's MolecularSieve
    # equipment correlation is ethanol/water based, so its ATT gas-service
    # cost/utility results remain provisional.
    dryer_water_to_dry_gas_fraction: 0.0
    dryer_status: "Native BioSTEAM MolecularSieve with reduced-order Water split; ATT-specific dryer performance/cost remains provisional."

    # U3P uses a native component Splitter as an idealized PSA surrogate.
    # H2 recovery is provisional; all non-H2 gases are sent to tail gas.
    # This gives an ideal-purity H2 product and intentionally does not yet
    # represent PSA adsorbent/cycle/power/capital correlations.
    # BASELINE (scenario 1): PSA on, as before. Scenario 4 (full CO2 capture, about 98.6 mol % H2 in the dried gas) runs
    # without it (analyses/att/scenarios.py); psa_enabled false compresses the gas straight to h2_product.
    psa_enabled: true
    psa_h2_recovery: 0.90
    psa_non_h2_to_product_fraction: 0.0
    psa_status: "Provisional ideal-selectivity PSA surrogate; H2 recovery/purity require collaborator confirmation."
    # PSA capital (installed): BioSTEAM has no PSA model, so U3P carries one cost item,
    # anchor x (H2 product / anchor capacity) ** exponent x cost_factor.
    psa_cost:
      status: PRELIMINARY (not a correlation or vendor quote)
      anchor_installed_cost_usd: 45000000.0
      anchor_capacity_t_H2_per_day: 203.4
      exponent: 0.6
      cost_factor: 1.0
      source: "Review statement: PSA unit cost 45-81 million USD for 203.4-453.6 t H2/d (arXiv:2502.12211, citing primary studies not checked); lower anchor used, six-tenths scaling on H2 product capacity; cost year and scope (installed vs purchased) not confirmed, treated as installed and not escalated. Sensitivity: att_tea.yaml PSA_capex_factor."
    # U3K compressor type: BioSTEAM picks screw compressors, outside their bounds (10-750 hp)
    # at this size; reciprocating is the conventional service for the PSA-feed gas and is
    # within its correlation bounds.
    h2_compressor_type: Reciprocating

    # U3K native isothermal compressor: compresses the dried gas to the PSA feed
    # pressure, which is also the H2 delivery pressure (a PSA at 90 % recovery
    # needs a high-pressure feed; the product leaves at the feed pressure).
    # The PSA tail gas is let down to the burner pressure in the valve U3V.
    # Pressures and efficiency are provisional placeholders.
    h2_product_pressure_Pa: 2000000.0
    tail_gas_pressure_Pa: 130000.0
    h2_compressor_efficiency: 0.70
    h2_compressor_status: "Provisional 2 MPa product pressure and 70% isothermal efficiency; final H2 delivery specification unresolved."

    # Tail gas is retained as an explicit stream. SIMPLE OFFSET (user decision
    # 2026-10-15): it is assumed to be burned in the U2 burner, displacing
    # purchased natural gas up to U2's fuel demand (tail gas LHV replaces the same
    # LHV of natural gas at the same burner efficiency); the burner itself is
    # not modeled. 'offset_u2_natural_gas' | 'none'. Biogenic CO2 from burning
    # is not counted (GWP 0, as for the other biogenic carbon); no CH4 slip.
    tail_gas_combustion: offset_u2_natural_gas
    # PLANNED (not implemented): replace the offset by a real fired heater for
    # U2, following the FiredHeater facility of the MCCA whey-olefins model
    # (ASPECT concept paper, whey_olefins_prelim.py): connect u3_tail_gas as a
    # stream burned with air plus a natural-gas makeup stream, with a flue-gas
    # outlet, and cost it with a Seider et al. 2017 fired-heater correlation
    # from the VIFF toolkit ("Heater, pyrolysis": 0.737 Q^0.81, Q in Btu/hr,
    # 10-500 MMBtu/hr, bare-module factor 2.19; Sinnott box furnace 30-120 MW as
    # an alternative). U2's duty at the SaBRe scale (~750 MMBtu/hr, ~220 MW)
    # exceeds one heater, so use parallel units; the 1 kg/h baseline is far
    # below the correlation minimum. See README_ATT.md, "Planned work".
    # heat-recovery modeling. No combustion credit is applied in Step 7.5.
    tail_gas_combustion_status: "Simple offset only: tail gas fed to the U2 furnace (U2 ins[1]) displaces natural gas (see tail_gas_combustion); no separate burner unit, flue gas or burner capital modeled."

  downstream:
    # Dissolution before F1.
    dissolution_water_kg_per_kg_Na2CO3: 3.0

    # C1 causticization.
    causticization_conversion: 0.85
    lime_equiv: 1.1
    causticization_temperature_K: 363.15
    # C1 energy basis (2026-10-09): Hnet with 298.15 K infinite-dilution
    # aqueous-ion Hf for NaOH/Na2CO3; liquor sensible heat from BioSTEAM.
    # Concentrated-solution terms are NOT modelled; bounded instead:
    #  - liquor sensible heat 28->90 C: BioSTEAM 1681 kJ/h vs 1664-1757 from
    #    handbook Na2CO3(aq) Cp (General Chemical soda-ash guide, Fig. 2-5);
    #  - molten-salt phase offset of dissolved salts at 298 K: +1 kJ/h net;
    #  - NaOH(aq) relative enthalpy at outlet (17.6 wt%, Olsson): +16 kJ/h;
    #  - Na2CO3(aq) relative enthalpy at inlet (25 wt%; NBS + soda-ash guide
    #    Fig. 2-1): +70 to +190 kJ/h; outlet Na2CO3: -30 to 0 kJ/h;
    #  - reaction heat-capacity change 25->90 C: about +/-100 kJ/h.
    # Net: about -40 to +300 kJ/h on the 1700 kJ/h process duty (-2 to +18 %),
    # i.e. -0.2 to +1.2 % of total plant heating (25.7 MJ/h per kg/h dry feed),
    # smaller than the U2 HHV sensitivity width (~1.6 MJ/h). Documented as a
    # limitation; no concentrated-solution property model is used.
    c1_energy_basis_status: "Infinite-dilution aqueous reference; concentrated-solution enthalpy not modelled, bounded at -40 to +300 kJ/h (<1.2 % of plant heat)."

    # Solid-liquid separation baseline. Active Step 7.3 units use native
    # BioSTEAM filters. Insoluble solids are retained ideally for now, while
    # the wet cake carries representative mother liquor (Water + Na2CO3 +
    # NaOH) rather than pure water. Solute loss is therefore calculated
    # dynamically from the cake-moisture target and liquid composition.
    filtration_solids_recovery: 1.0
    cake_liquid_model: proportional_mother_liquor_entrainment
    f1_filter_type: PressureFilter
    f2_filter_type: RotaryVacuumFilter

    # F1 and F2 use different wet-cake moisture assumptions because the
    # cake matrices are different.
    #
    # F1: ash + discarded biomass residue. 30 wt% is retained as the
    # current literature-supported engineering baseline.
    f1_cake_moisture_wt_frac: 0.30

    # F2: CaCO3 + residual Ca(OH)2 mineral cake. 25 wt% is the revised
    # baseline from the CaCO3/lime-filtration literature review.
    f2_cake_moisture_wt_frac: 0.25

    # Step 7.13: hypothetical wash-displacement model; disabled reproduces baseline.
    # Wash water and dissolved NaOH/Na2CO3 all conserved. Thermal mixing unresolved.
    # Lime recycle: the F2 cake is calcined in a lime kiln (CaCO3 -> CaO + CO2; Ca(OH)2 -> CaO + H2O),
    # slaked back to Ca(OH)2 and returned to C1 (the kraft-pulping lime cycle). Fresh Ca(OH)2 only makes
    # up the lime purge and the shortfall. Sodium in the cake rides with the lime and returns to C1.
    lime_recycle:      # BASELINE (scenario 1): fresh Ca(OH)2, cake disposed; scenario 2 recycles it (analyses/att/scenarios.py)
      enabled: false
      calcination_conversion: 0.98      # CaCO3 -> CaO; the rest recycles as inert dead load
      purge_fraction: 0.05              # share of the burnt lime sent to disposal (impurities; kraft makeup is 5-10 %)
      solids_outlet_temperature_K: 363.15   # lime leaves cooled: its heat is recovered inside the kiln (air preheat)
      exhaust_temperature_K: 473.15
      heat_loss_fraction: 0.45          # lumps flue-gas, shell and discharge losses on the net duty; calibrated so the fuel is about 7.4 GJ LHV per t CaO (7 MMBtu/ton, the low end of the 7-8 MMBtu/ton quoted for kraft kilns)
      slaking_water_ratio: 1.0          # kmol water per kmol CaO (semi-dry slaking to a dry hydrate)
      kiln_area_m2_per_t_CaO_per_day: 3.14   # a kraft kiln of ~400 t CaO/d is about 4 m x 100 m (1,257 m2)
      refractory_factor: 2.0            # kiln shell cost = BioSTEAM drum-dryer correlation x this (refractory lining; assumed)
      status: "PRELIMINARY: no sourced modern kiln cost; the rotating shell is costed with BioSTEAM's drum-dryer correlation (area-based) times an assumed refractory factor, the firing with the BioSTEAM furnace correlation. +/-50 % or worse."
    f2_washing:
      enabled: false
      wash_ratio_kg_per_kg_dry_cake: 1.0
      displacement_factor: 1.0
      temperature_K: 363.15

    # Whole-liquor purge/recycle.
    #
    # The source reports "95% NaOH recycling" but does not define a
    # selective NaOH/Na2CO3 separator. The engineering baseline therefore
    # interprets this provisionally as 95% whole-liquor recycle and 5% purge.
    # This parameter should be sensitivity-tested after steady-state
    # carbonate buildup is quantified.
    whole_liquor_recycle_fraction: 0.95

    # EC1 (single-effect vacuum evaporator, 90 C). Fresh solid NaOH is added
    # in M1 with the feed. EC1 evaporates only the water in excess of what
    # keeps the recycle liquor at NaOH/(NaOH + H2O) = recycle_naoh_wt_frac
    # after the makeup; it evaporates nothing if the liquor already holds
    # less water (user decision 2026-10-09: minimum evaporation, the 50 %
    # definition is not binding).
    recycle_naoh_wt_frac: 0.50
    recycle_naoh_concentration_basis: naoh_plus_water
    concentration_temperature_K: 363.15
    # EC1 uses a simple model (user decision 2026-10-15): duty = latent heat
    # of the evaporated water plus liquor sensible heat; no electrolyte
    # property correlations. The three constants below are tuned to the
    # baseline (EC1 at 90 C, feed liquor ~17.6 wt % NaOH, outlet ~44 wt %
    # NaOH, 95 % whole-liquor recycle); their valid ranges are noted with
    # each. To get the NaOH(aq) property model back (Olsson 1997 vapor
    # pressure and enthalpy, Wu 2020 Na2CO3 solubility; EC1 with boiling
    # pressure, heat of concentration and salting-out; the U2 inlet
    # electrolyte correction), restore biorefineries/sabre/_naoh_properties.py
    # and the EC1 / aqueous_naoh_enthalpy_correction_kJph code in
    # units/_att.py from commit e64370ab (last commit with it, already with
    # the fresh NaOH makeup in M1): git checkout e64370ab -- <file>. The
    # original version with the separate M2 makeup mixer is commit 9d5f93a9.
    # Boiling-point elevation of ~44 wt% NaOH at 90 C: the water vapor
    # pressure over NaOH(aq) (Olsson et al. 1997) is 17.2 kPa, i.e. the vapor
    # condenses at 57 C. Supplier boiling-point curves agree within 2.5 K.
    ec1_boiling_point_elevation_K: 33.0
    # VALID RANGE: EC1 outlet 0.40-0.46 NaOH/(NaOH + H2O) (about 28-36 K) at
    # 90-115 C (the elevation changes by only ~2 K between them). It rises
    # steeply with concentration: 16 K at 0.30, 22 K at 0.35, 42 K at 0.50.
    # It only sets the condenser temperature and the vacuum pressure (not
    # costed) and the vapor temperature in the optional heat integration;
    # re-derive it if the recycle ratio or NaOH loading changes the outlet
    # concentration outside this range.
    # Fraction of the Na2CO3 fed to EC1 that stays dissolved; the rest
    # crystallizes as anhydrous Na2CO3 and is recycled with the slurry (no
    # solid-liquid separation). Na2CO3 is nearly insoluble in ~50 wt% NaOH:
    # the Wu et al. (2020, ACS Omega 5, 4875) 363.15 K data give about 5 % of
    # the recycle carbonate dissolved at the 50 wt% target. That solubility
    # rests on a single source and the solid identity (Na2CO3 vs
    # Na2CO3.H2O) is unresolved; the energy effect is below 0.1 % of plant heat.
    ec1_na2co3_dissolved_fraction: 0.05
    # VALID RANGE: 0.05-0.11. The Wu et al. 2020 data (363.15 K) give 0.05 at
    # the 0.50 NaOH/(NaOH + H2O) of the recycle target (liquor plus fresh
    # makeup) and 0.11 at the 0.44 EC1 outlet; 0.17 at 0.40 and 0.28 at 0.35
    # for the baseline carbonate load (0.18 kg Na2CO3 per kg outlet water).
    # The value scales with the carbonate load, so re-derive it if the
    # purge/recycle ratio or the causticization conversion changes it
    # markedly. Valid only at 363 K (solubility data); the mass effect is
    # 0.014 kg/h of 0.24 kg/h at the 1 kg/h dry basis.
    # Heat of solution of NaOH(s) at infinite dilution, 25 C [kJ/kg NaOH]
    # (NBS: -44.5 kJ/mol; Olsson et al. 1997 and the OxyChem Caustic Soda
    # Handbook give 1048-1113 kJ/kg). Used for the U2 inlet enthalpy of the
    # dissolved NaOH in the recycle liquor (ThermoSTEAM treats it as molten
    # NaOH). The same infinite-dilution reference as the C1 aqueous-ion basis;
    # the heat of concentration in EC1 (~0.4 MJ/kg NaOH) is lumped into this
    # constant and not charged to EC1.
    naoh_heat_of_solution_kJ_per_kg: 1113.0
    # VALID RANGE: EC1 FEED liquor up to ~0.20 NaOH/(NaOH + H2O) (baseline
    # 0.176), where the integral heat of solution is flat at 1080-1090 kJ/kg
    # (25-90 C; 1113 is the NBS infinite-dilution value, ~3 % higher).
    # Because the heat of concentration in EC1 is lumped into this constant,
    # the relevant concentration is the EC1 feed, not the recycle liquor. A
    # more concentrated EC1 feed needs a lower value: about 925 kJ/kg at 0.30
    # and 735 kJ/kg at 0.40 (90 C). The sources span 1048-1113 kJ/kg.

    # Heat loss as a fraction of process heating duty (workbook: 5 %),
    # applied to C1 and EC1.
    heat_loss_fraction: 0.05
  energy_sources:
    natural_gas:
      emission_factor_kgCO2e_per_MJ_fuel: 0.056
      burner_efficiency: 0.9
    engine_waste_heat:
      emission_factor_kgCO2e_per_MJ_heat: 0.0
    marine_fuel:
      emission_factor_kgCO2e_per_L: 3.2
      LHV_MJ_per_kg: 41.0
  heat_recovery:
    residue_cooling_target_temperature_K: 363.15
    residue_cooler_rigorous_vle: false
    solid_cooler_estimate_pressure_drop: false
    gas_path_status: U2 gas/steam leaves the reactor hot and goes directly to U3 gas treatment; no pre-U3 gas cooling
      is included in the current stage.
    gas_energy_diagnostic_species:
    - H2
    - CH4
    - CO
    hydrogen_disposition: product
    hydrogen_energy_credit_status: H2 product is a saleable product and is not credited as process fuel. The
      unrecovered H2 in the PSA tail gas is burned with the tail gas (natural gas offset).
    integration_method: BioSTEAM HeatExchangerNetwork (HXN facility, on by default; U2's fired duty is excluded)
    minimum_approach_temperature_K: 10.0
    minimum_approach_temperature_status: design assumption (BioSTEAM default is 5 K); must be verified before final TEA
    # Exchanger ratings of the gas and solids coolers (BioSTEAM's default
    # U = 0.5 kW/m2/K and carbon steel suit liquids and condensing steam, not
    # a hot CO2/H2 gas with 62 t/h of condensing water or a hot solid).
    # Engineering assumptions, not vendor data.
    U3HX_heat_transfer_coefficient_kW_per_m2_per_K: 0.1
    RC1_heat_transfer_coefficient_kW_per_m2_per_K: 0.05
    cooler_material: Stainless steel/stainless steel
    # Assumed process temperatures of duties that BioSTEAM carries without a stream
    # (only used to size their exchangers; not matched in the HXN).
    u3k_interstage_temperature_K: 400.0
    u3d_regeneration_temperature_K: 400.0   # kept at the LP-steam level, as before
    hydrogen_product_species:
    - H2
    future_tail_gas_fuel_species:
    - H2
    - CH4
    - CO
    future_U3_sequence: condense and dry gas -> PSA H2 separation -> compress H2 product -> burn remaining combustible
      tail gas; include heat exchangers as needed
  feed_energy_reference:
    HHV_MJ_per_kg_daf_baseline: 16.9
    HHV_MJ_per_kg_daf_lower: 15.7
    HHV_MJ_per_kg_daf_upper: 19.5
    basis: dry ash-free Sargassum
    status: literature-based reference reported in the Excel energy-analysis assumptions; not a measured HHV for
      the modeled SaBRe feed
    used_in_current_heat_recovery: false

  # Research-stage TEA/LCA inventory (user decisions 2026-10-09). Read by
  # biorefineries/sabre/analyses/att/inventory.py. Utilities are reported as
  # simulated, after BioSTEAM's HeatExchangerNetwork when it is in the system.
  inventory:
    reference_scale:
      basis: "NLR preprint plant scale: feed_preparation.scale.wet_feed_tonnes_per_year (3 million wet t/yr) with the nlr_fresh moisture fraction; tea.yaml operating_days."
      status: "ATT-specific scale chosen to match the NLR preprint TEA (the SaBRe common scale of 15,000 wet t/d is not used)."
    # U2 gas closure (user decision 2026-10-10; reactor.material_balance).
    # Fate of every external stream: [direction, category, note].
    stream_fates:
      att_sargassum_feed: [input, feedstock, "Pelagic Sargassum as harvested (wet)."]
      dryer_air: [input, ambient_air, "D0 drying air; no burden."]
      dryer_backup_fuel: [input, fuel, "Not used in the baseline (zero flow)."]
      dissolution_water: [input, process_water, "D1 dissolution water."]
      lime: [input, reagent, "Ca(OH)2, stoichiometric x lime_equiv."]
      fresh_naoh_solid: [input, reagent, "Solid NaOH makeup (dissolved in M1)."]
      h2_product: [output, main_product, "PSA H2 at the PSA feed pressure (2 MPa; the dried gas is compressed in U3K before the PSA)."]
      u3_tail_gas: [output, coproduct_offgas, "PSA off-gas (mainly CH4 and unrecovered H2), assumed collected (100 %) and burned in the U2 burner (natural gas offset, no burner modeled). Earlier note: final fate UNRESOLVED (combustion, utilization or venting not modeled). Not purified; no combustion heat credit; value to be set in TEA."]
      caco3_cake: [output, coproduct, "CaCO3 cake with excess Ca(OH)2 and entrained liquor. Physically accounted; no revenue or displacement credit in the baseline."]
      ash_residue_cake: [output, solid_waste, "Ash, char and entrained liquor from F1; disposal."]
      liquor_purge: [output, liquid_waste, "Alkaline purge (NaOH/Na2CO3); neutralization and treatment."]
      lime_purge: [output, solid_waste, "Purge of the burnt lime (lime recycle); carries the sodium of that share."]
      kiln_exhaust: [output, air_emission, "Lime kiln exhaust: CO2 from CaCO3 (biogenic, from the seaweed carbon) and water vapor."]
      slaking_water: [input, process_water, "Water for slaking CaO to Ca(OH)2."]
      excess_condensate: [output, wastewater, "Condensate (EC1 and U3C) in excess of the D1 dissolution-water demand; normally zero."]
      u3_condensate: [internal, recycle, "U3C gas condensate, recycled to D1 (dissolution water)."]
      ec1_condensate: [internal, recycle, "EC1 evaporator condensate, recycled to D1 (dissolution water)."]
      biostimulant_juice: [output, coproduct, "fresh-Sargassum case: press liquid of P1 = raw juice for biostimulant production (water, plus the solids not retained by the press). Transferred at zero price and burden; present only in the fresh_sargassum configuration."]
      u3_condensate: [output, wastewater, "U3 gas condensate."]
      u3_dryer_removed_water: [output, wastewater, "U3D removed water."]
      ec1_condensate: [output, wastewater, "EC1 evaporator condensate."]
      dryer_exhaust: [output, air_emission, "Drying air and water vapor; no GHG."]
      dryer_emissions: [output, air_emission, "Zero flow in the baseline."]
    lca:
      impact: "GWP100, kg CO2e"
      # Collaborators' emission-factor table (primary source; do not replace
      # without a clear reason). Natural gas: att.energy_sources.natural_gas.
      emission_factors:
        NaOH: {value: 1.12, range: [0.63, 2.16], unit: kg CO2e/kg NaOH, source: "ATT collaborators' emission-factor table", boundary: cradle-to-gate}
        CaOH2_limestone: {value: 0.91, range: [0.59, 1.00], unit: kg CO2e/kg Ca(OH)2, source: "ATT collaborators' emission-factor table", boundary: cradle-to-gate}
        CaOH2_steel_slag: {value: 0.0, range: [0.0, 0.10], unit: kg CO2e/kg Ca(OH)2, source: "ATT collaborators' emission-factor table (assumed)", boundary: cradle-to-gate}
        electricity: {value: 0.449, range: [0.3, 0.9], unit: kg CO2e/kWh, source: "GREET 2022 US mix, as used in biorefineries/HP/process_settings.py (BioSTEAM project)", boundary: "grid, production = consumption", status: "Location-dependent placeholder; replace with the plant's grid factor. Range indicative (gas- to oil-dominated grids)."}
      ca_oh2_baseline_source: CaOH2_limestone
      # Steam is generated in a natural-gas boiler: fuel = steam heat / efficiency.
      steam_boiler_efficiency: 0.80
      steam_boiler_efficiency_range: [0.80, 0.90]
      steam_boiler_efficiency_source: "BioSTEAM BoilerTurbogenerator default boiler_efficiency (0.80)."
      # Cooling-water electricity from the BioSTEAM CoolingTower correlation
      # (Humbird et al. 2011): tower 1598 kW per 557183 kmol/h, pump 1021 kW
      # per 609624 kmol/h of circulating water.
      cooling_water_kW_per_kmolph: [0.0028680, 0.0016748]
    # Engineering estimates for equipment that has no BioSTEAM cost in the
    # model (TEA input only; no effect on mass or energy balances).
    cost_estimates:
      C1: {method: bst.MixTank, tau_h: 2.0, note: "Agitated causticizer; residence time typical of kraft recausticizing (~1.5-3 h), assumed."}
      U2_vessel: {method: "BioSTEAM PressureVessel (vertical)", tau_h: 1.0, density_kg_per_m3: 1200.0, fill_fraction: 0.8, length_to_diameter: 3.0, material: Inconel-600, note: "No ATT reaction-time data; 1 h on the inlet volume, assumed. Elevated-temperature allowable stress not modeled."}
      EC1: {method: "Seider et al. forced-circulation evaporator correlation (A in ft2, <= 8000 ft2 per unit, CE 500)", U_W_per_m2_K: 1000.0, vessel_holdup_h: 0.25, vessel_fill_fraction: 0.5, liquor_density_kg_per_m3: 1300.0, note: "U from heat_recovery overall_U steam_to_boiling_liquor. Carbon-steel correlation; nickel tubes for caustic service not applied (cost likely low). Condenser: bst.HXutility; vacuum: BioSTEAM vacuum-system correlation."}
      U3P: {method: none, note: "MISSING: no BioSTEAM PSA correlation. Use a literature line item (e.g. Spath et al. 2005, NREL/TP-510-37408) or a vendor quote."}
